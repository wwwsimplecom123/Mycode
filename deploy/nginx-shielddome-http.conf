limit_req_zone $binary_remote_addr zone=shielddome_api:10m rate=20r/s;

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    location /api/ {
        limit_req zone=shielddome_api burst=40 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        root /opt/shielddome/web;
        try_files $uri /index.html;
    }
}
